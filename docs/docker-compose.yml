services:
  pichub:
    image: ghcr.io/untitled572/pichub-aggregator:latest
    network_mode: host
    volumes:
      - ./pichub_data:/app/data
      - ./pichub_cache:/app/cache
    environment:
      - PUID=1000
      - PGID=1000
      - PORT=5721
      - DB_PATH=/app/data/pichub.db
      - CACHE_PATH=/app/cache
    restart: unless-stopped
