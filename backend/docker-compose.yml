services:
  pichub:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
    environment:
      - PUID=1000
      - PGID=1000
      - PORT=5721
      - DB_PATH=/app/data/pichub.db
      - CACHE_PATH=/app/cache
      - TRUSTED_PROXIES=127.0.0.1/32
    restart: unless-stopped
