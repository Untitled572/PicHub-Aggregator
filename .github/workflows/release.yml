name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npx vue-tsc --noEmit && npx vite build
        working-directory: dashboard
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/

  build-binaries:
    needs: build-dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: backend/embed/dist/
      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64
      - name: Build linux-amd64
        run: |
          cd backend
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o pichub .
          mkdir -p ../release/pichub-linux-amd64
          cp pichub ../release/pichub-linux-amd64/
          cp config/config.json ../release/pichub-linux-amd64/
          cp ../README.md ../release/pichub-linux-amd64/
          cd ../release && tar czf pichub-linux-amd64.tar.gz pichub-linux-amd64/
      - name: Build linux-arm64
        run: |
          cd backend
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -o pichub .
          mkdir -p ../release/pichub-linux-arm64
          cp pichub ../release/pichub-linux-arm64/
          cp config/config.json ../release/pichub-linux-arm64/
          cp ../README.md ../release/pichub-linux-arm64/
          cd ../release && tar czf pichub-linux-arm64.tar.gz pichub-linux-arm64/
      - name: Build windows-amd64
        run: |
          cd backend
          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -o pichub.exe .
          mkdir -p ../release/pichub-windows-amd64
          cp pichub.exe ../release/pichub-windows-amd64/
          cp config/config.json ../release/pichub-windows-amd64/
          cp ../README.md ../release/pichub-windows-amd64/
          cd ../release && zip -r pichub-windows-amd64.zip pichub-windows-amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/*

  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          fi
      - name: Load Android signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PICHUB_ANDROID_KEYSTORE_BASE64 }}
          PICHUB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PICHUB_ANDROID_KEYSTORE_PASSWORD }}
          PICHUB_ANDROID_KEY_ALIAS: ${{ secrets.PICHUB_ANDROID_KEY_ALIAS }}
          PICHUB_ANDROID_KEY_PASSWORD: ${{ secrets.PICHUB_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing is not configured. This release will have no APK."
            exit 0
          fi
          : "${PICHUB_ANDROID_KEYSTORE_PASSWORD:?Missing Android keystore password}"
          : "${PICHUB_ANDROID_KEY_ALIAS:?Missing Android key alias}"
          : "${PICHUB_ANDROID_KEY_PASSWORD:?Missing Android key password}"
          umask 077
          keyfile="$RUNNER_TEMP/pichub-android.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          echo "PICHUB_ANDROID_KEYSTORE_FILE=$keyfile" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Test and build Android
        working-directory: android
        env:
          PICHUB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PICHUB_ANDROID_KEYSTORE_PASSWORD }}
          PICHUB_ANDROID_KEY_ALIAS: ${{ secrets.PICHUB_ANDROID_KEY_ALIAS }}
          PICHUB_ANDROID_KEY_PASSWORD: ${{ secrets.PICHUB_ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease \
            -PpichubVersionName="$GITHUB_REF_NAME" -PpichubVersionCode="$GITHUB_RUN_NUMBER"
      - name: Verify release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          size=$(stat -c %s "$apk")
          echo "Signed APK size: $size bytes"
          if (( size > 5 * 1024 * 1024 )); then
            echo "::error::The signed universal APK exceeds 5 MiB. Check R8, resource shrinking and DEX compression."
            exit 1
          fi
          mkdir -p release
          cp "$apk" release/pichub-android.apk
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: release-android
          path: release/pichub-android.apk
          if-no-files-found: error

  release:
    needs: [build-binaries, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release/
      - uses: actions/download-artifact@v4
        if: needs.build-android.outputs.signed == 'true'
        with:
          name: release-android
          path: release/
      - name: Generate release body
        id: tag_msg
        run: |
          title=$(git log --format=%s -1 ${{ github.ref_name }})
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${{ github.ref_name }}^" 2>/dev/null || true)
          {
            echo "body<<EOF"
            echo "$title"
            echo ""
            echo "## 更新内容"
            if [ -n "$prev" ]; then
              git log --format='- %s' "$prev..${{ github.ref_name }}"
            else
              echo "- Initial release"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag_msg.outputs.body }}
          files: release/*
