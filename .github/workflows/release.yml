name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npx vue-tsc --noEmit && npx vite build
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/

  build-linux:
    needs: build-dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: backend/embed/dist/
      - name: Build linux-amd64
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o pichub-linux-amd64 ./backend/
          mkdir -p release/pichub-linux-amd64
          cp pichub-linux-amd64 release/pichub-linux-amd64/pichub
          cp backend/config/config.json release/pichub-linux-amd64/
          cp README.md release/pichub-linux-amd64/
          cd release && tar czf pichub-linux-amd64.tar.gz pichub-linux-amd64/
      - name: Build linux-arm64
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -o pichub-linux-arm64 ./backend/
          mkdir -p release/pichub-linux-arm64
          cp pichub-linux-arm64 release/pichub-linux-arm64/pichub
          cp backend/config/config.json release/pichub-linux-arm64/
          cp README.md release/pichub-linux-arm64/
          cd release && tar czf pichub-linux-arm64.tar.gz pichub-linux-arm64/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*.tar.gz

  build-windows:
    needs: build-dashboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: backend/embed/dist/
      - name: Build windows-amd64
        run: |
          $env:CGO_ENABLED=1; $env:GOOS="windows"; $env:GOARCH="amd64"
          go build -o pichub.exe ./backend/
          Compress-Archive -Path pichub.exe, backend\config\config.json, README.md -DestinationPath pichub-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: pichub-windows-amd64.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release-linux/*
            artifacts/release-windows/*
