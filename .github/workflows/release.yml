name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npx vue-tsc --noEmit && npx vite build
        working-directory: dashboard
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/

  build-binaries:
    needs: build-dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: backend/embed/dist/
      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64
      - name: Build linux-amd64
        run: |
          cd backend
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o pichub .
          mkdir -p ../release/pichub-linux-amd64
          cp pichub ../release/pichub-linux-amd64/
          cp config/config.json ../release/pichub-linux-amd64/
          cp ../README.md ../release/pichub-linux-amd64/
          cd ../release && tar czf pichub-linux-amd64.tar.gz pichub-linux-amd64/
      - name: Build linux-arm64
        run: |
          cd backend
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -o pichub .
          mkdir -p ../release/pichub-linux-arm64
          cp pichub ../release/pichub-linux-arm64/
          cp config/config.json ../release/pichub-linux-arm64/
          cp ../README.md ../release/pichub-linux-arm64/
          cd ../release && tar czf pichub-linux-arm64.tar.gz pichub-linux-arm64/
      - name: Build windows-amd64
        run: |
          cd backend
          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -o pichub.exe .
          mkdir -p ../release/pichub-windows-amd64
          cp pichub.exe ../release/pichub-windows-amd64/
          cp config/config.json ../release/pichub-windows-amd64/
          cp ../README.md ../release/pichub-windows-amd64/
          cd ../release && zip -r pichub-windows-amd64.zip pichub-windows-amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/*

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release/
      - name: Generate release body
        id: tag_msg
        run: |
          title=$(git log --format=%s -1 ${{ github.ref_name }})
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${{ github.ref_name }}^" 2>/dev/null || true)
          {
            echo "body<<EOF"
            echo "$title"
            echo ""
            echo "## 更新内容"
            if [ -n "$prev" ]; then
              git log --format='- %s' "$prev..${{ github.ref_name }}"
            else
              echo "- Initial release"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag_msg.outputs.body }}
          files: release/*
