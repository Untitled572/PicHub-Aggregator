name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ACR_REGISTRY: crpi-1ml0uqt093yc1v96.cn-beijing.personal.cr.aliyuncs.com
  ACR_IMAGE_NAME: untitled572/pichub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push to GHCR
        id: image_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_APP_VERSION=${{ github.ref_name }}

      # GHCR keeps provenance; ACR receives the runnable image manifest only.
      - name: Sync Linux image to ACR
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_DIGEST: ${{ steps.image_build.outputs.digest }}
          ACR_IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE_NAME }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_image="${SOURCE_IMAGE,,}@${SOURCE_DIGEST}"
          docker pull --platform linux/amd64 "$source_image"
          docker tag "$source_image" "$ACR_IMAGE:$IMAGE_TAG"
          docker push "$ACR_IMAGE:$IMAGE_TAG"
          docker tag "$source_image" "$ACR_IMAGE:latest"
          docker push "$ACR_IMAGE:latest"
