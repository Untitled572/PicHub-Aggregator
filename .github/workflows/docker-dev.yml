name: Docker Dev Build
on:
  push:
    branches:
      - dev

concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-1ml0uqt093yc1v96.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/untitled572/pichub-aggregator
          tags: |
            type=raw,value=dev

      - name: Build and push to GHCR
        id: image_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VITE_APP_VERSION=${{ github.ref_name }}

      # GHCR keeps provenance; ACR receives the runnable image manifest only.
      - name: Sync Linux image to ACR
        env:
          SOURCE_IMAGE: ghcr.io/untitled572/pichub-aggregator
          SOURCE_DIGEST: ${{ steps.image_build.outputs.digest }}
          ACR_IMAGE: crpi-1ml0uqt093yc1v96.cn-beijing.personal.cr.aliyuncs.com/untitled572/pichub
          IMAGE_TAG: dev
        run: |
          set -euo pipefail
          source_image="${SOURCE_IMAGE,,}@${SOURCE_DIGEST}"
          docker pull --platform linux/amd64 "$source_image"
          docker tag "$source_image" "$ACR_IMAGE:$IMAGE_TAG"
          docker push "$ACR_IMAGE:$IMAGE_TAG"
